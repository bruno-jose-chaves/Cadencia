function rankInner(ch){const rows=rowsFor(ch),live=ch.online?(S.rankLive?'<span style="color:var(--ok)">ao vivo</span>':'<span style="color:var(--bad)">offline</span>'):'<span style="color:var(--t3)">neste aparelho</span>';
  const top=rows.slice(0,3),order=[1,0,2],hs=[62,92,44];
  const podium=rows.length?'<div style="display:flex;align-items:flex-end;gap:9px;padding:0 18px 14px">'+order.map((idx,i)=>{const r=top[idx];if(!r)return '<div style="flex:1"></div>';
      return '<div style="flex:1;text-align:center"><div class="sub" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name||"Anônimo")+'</div>'
        +'<div style="height:'+hs[i]+'px;border-radius:12px 12px 0 0;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font:700 18px var(--fm);background:'+(r.me?"var(--acc)":"var(--surf)")+';border:1px solid '+(r.me?"var(--acc)":"var(--bd)")+';color:'+(r.me?"#101317":"var(--t2)")+'">'+(idx+1)+'º</div></div>';}).join("")+'</div>':'';
  const banner=(ch.online&&S.rankOffline)?'<div style="margin:0 18px 12px;background:var(--bad-bg);border:1px solid var(--bad-bd);border-radius:12px;padding:11px 13px" class="split"><div><div style="font:600 14px var(--fb);color:var(--bad)">Sem conexão</div><div class="sub" style="font-size:12.5px">'+(ch.lastAt?"mostrando o ranking salvo às "+new Date(ch.lastAt).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"nenhum ranking salvo ainda")+'</div></div><button class="link" data-a="rankRetry" style="padding:0">tentar</button></div>':'';
  const pres=S.rankPres?'<div class="sub" style="padding:0 18px 10px;color:var(--bad)">● '+esc(S.rankPres)+'</div>':'';
  return banner+podium+pres+'<div class="split" style="padding:0 18px 9px"><div class="lbl">Classificação</div><div style="font:700 11px var(--fc);letter-spacing:.14em;text-transform:uppercase">'+live+'</div></div>'
    +(rows.length?'<div style="padding:0 18px 12px;display:flex;flex-direction:column;gap:8px">'+rows.map((r,i)=>'<div class="card split" style="padding:11px 13px'+(r.me?";border-color:var(--acc);background:var(--acc-bg)":"")+'"><div style="display:flex;gap:11px;align-items:center;min-width:0"><span class="mono" style="font-weight:700;width:26px;color:'+(i<3?"var(--acc)":"var(--t3)")+'">'+(i+1)+'º</span><div style="min-width:0"><div style="font:600 15px var(--fb)">'+esc(r.name||"Anônimo")+'</div><div class="sub" style="font-size:12.5px">'+fmt(+r.total||0,2)+' s'+(r.acc!=null?' · '+(+r.acc||0)+'%':'')+'</div></div></div><span class="mono" style="font-weight:700;font-size:17px;color:var(--acc)">'+fmt(+r.hf||0,2)+'</span></div>').join("")+'</div>'
      :'<div class="empty" style="margin:0 18px">Sem resultados ainda. Seja o primeiro.</div>');}
function paintRanking(){const ch=curChal(),box=$("#rankBox");if(ch&&box)box.innerHTML=rankInner(ch);}
/* liga os listeners em tempo real (resultados + presença) e guarda o último ranking para o modo offline */
function attachRanking(){const ch=curChal();if(!ch)return;S.rankRows=null;S.rankPres="";
  if(!ch.online){S.rankLive=false;S.rankOffline=false;paintRanking();return;}
  detachChal();S.rankOffline=!navigator.onLine;S.rankLive=false;paintRanking();
  ensureOnline().then(ok=>{if(!ok||S.screen!=="ranking"){S.rankOffline=true;paintRanking();return;}
    const base=fb.db.collection("challenges").doc(ch.code);
    chalUnsub.push(base.collection("results").onSnapshot(sn=>{const rows=[];sn.forEach(d=>rows.push(d.data()));
      S.rankRows={id:ch.id,rows};ch.lastRows=rows;ch.lastAt=Date.now();save();
      S.rankLive=!sn.metadata.fromCache&&navigator.onLine;S.rankOffline=!S.rankLive;paintRanking();},()=>{S.rankOffline=true;paintRanking();}));
    chalUnsub.push(base.collection("presence").onSnapshot(sn=>{const live=[];sn.forEach(d=>{const p=d.data();if(p.status==="atirando"&&d.id!==fb.uid)live.push(p.name||"Alguém");});
      S.rankPres=live.length?live.join(", ")+(live.length>1?" estão atirando…":" está atirando…"):"";paintRanking();},()=>{}));});}
/* exige um nome antes de competir online (o ranking é público para quem tem o código) */
function needName(){if(userName())return true;toast("Coloque seu nome no perfil antes de competir online");go("profile");return false;}

document.addEventListener("input",e=>{const el=e.target;if(!el)return;
  if(el.id==="ncName"&&S.nc)S.nc.name=el.value;
  else if(el.id==="codeIn"){const v=el.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);S.code=v;S.codeFound=null;S.codeMsg="";render();const i=$("#codeIn");if(i){i.focus();}if(v.length===6)lookupCode(v);}
  else if(el.id==="pfName"){const p=DB.profiles.find(x=>x.id===DB.currentProfile);if(p){p.name=el.value;save();}}
  else if(el.id==="pfClub"){const p=DB.profiles.find(x=>x.id===DB.currentProfile);if(p){p.clube=el.value;save();}}
  else if(el.id==="pfGunModel"){const p=DB.profiles.find(x=>x.id===DB.currentProfile);if(p){p.model=el.value;save();}}
  else if(el.id==="onbName"){const p=DB.profiles.find(x=>x.id===DB.currentProfile);if(p){p.name=el.value;save();}}
  else if(el.id==="onbClub"){const p=DB.profiles.find(x=>x.id===DB.currentProfile);if(p){p.clube=el.value;save();}}});
async function lookupCode(code){S.codeMsg="Procurando…";render();
  if(!await ensureOnline()){S.codeMsg="Sem conexão — conecte para entrar num desafio online.";render();return;}
  try{const sn=await fb.db.collection("challenges").doc(code).get();
    if(!sn.exists){S.codeFound=null;S.codeMsg="Desafio não encontrado: "+code;}
    else{S.codeFound=Object.assign({code},sn.data());S.codeMsg="";}}
  catch(e){S.codeMsg="Não foi possível buscar o desafio agora.";}
  render();}

Object.assign(ACT,{
  newChal:()=>{S.nc={kind:"online",name:"",drillId:S.selId||(DB.drills[0]||{}).id,metric:"hf",dist:7,days:7};go("newChall");},
  ncKind:v=>{S.nc.kind=v;render();},
  ncDrill:v=>{S.nc.drillId=v;const d=drillById(v);if(d)S.nc.dist=d.dist||S.nc.dist;render();},
  ncMetric:v=>{S.nc.metric=v;render();},
  ncDist:v=>{S.nc.dist=Math.max(1,Math.min(50,Math.round(S.nc.dist)+(+v)));render();},
  ncDays:v=>{S.nc.days=Math.max(1,Math.min(90,S.nc.days+(+v)));render();},
  ncSave:async()=>{const n=S.nc,name=(n.name||"").trim();if(!name){toast("Dê um nome ao desafio");return;}
    const d=drillById(n.drillId);if(!d){toast("Escolha um drill");return;}
    const endsAt=Date.now()+n.days*864e5;
    if(n.kind==="local"){const ch={id:uid(),name,drillId:d.id,drillName:d.name,dist:n.dist,metric:n.metric,createdAt:Date.now(),endsAt};DB.challenges.push(ch);save();S.nc=null;S.chalId=ch.id;go("ranking");toast("Desafio criado");return;}
    if(!needName())return;toast("Criando…");
    try{if(!await ensureOnline())throw new Error("offline");
      const code=newCode(),snap={name:d.name,shots:d.shots,par:d.par,pen:d.pen||0,dist:d.dist,target:d.target||""};
      await fb.db.collection("challenges").doc(code).set({name,drillId:d.id,drillName:d.name,dist:n.dist,metric:n.metric,drillSnap:snap,endsAt,createdAt:Date.now(),ownerUid:fb.uid,ownerName:onlineName()});

/* CSV com proteção contra fórmula (v7 S7) */
function exportCSV(){const head=["data","atirador","drill","arma","calibre","distancia_m","tempo_total_s","tempo_1o_tiro_s","tiros","esperados","acertos","erros","pontos","precisao_pct","hit_factor","tempo_corrigido_s","splits_s","zonas","desafio","bloco_id","rep","bloco_tam"];
  const rows=DB.sessions.map(s=>[new Date(s.date).toLocaleString("pt-BR"),s.profileName,s.drillName,s.weapon,s.cal,s.dist,fmt(s.total,2),s.first!=null?fmt(s.first,2):"",s.nShots,s.expShots,s.hits,s.miss,s.points,s.acc,fmt(s.hf||0,2),s.corr?fmt(s.corr,2):"",(s.splits||[]).map(x=>fmt(x,2)).join(" "),(s.shotZones||[]).join(""),s.challengeId?((DB.challenges.find(c=>c.id===s.challengeId)||{}).name||""):"",s.blockId||"",s.repIndex||"",s.blockSize||""]
    .map(c=>{let v=String(c==null?"":c);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}).join(";"));
  downloadBlob("cadencia_treinos.csv",new Blob(["\uFEFF"+head.join(";")+"\n"+rows.join("\n")],{type:"text/csv"}));toast("CSV exportado");}
/* coerção numérica das sessões importadas (v7 S8) */
function sanitizeSession(s){if(!s||typeof s!=="object")return{};const n=v=>{const x=+v;return isFinite(x)?x:0;};
  ["total","hf","acc","nShots","hits","miss","points","corr","dist","expShots","repIndex","blockSize"].forEach(k=>{if(s[k]!=null)s[k]=n(s[k]);});
  if(s.first!=null)s.first=n(s.first);s.splits=Array.isArray(s.splits)?s.splits.map(n):[];
  if(s.shotZones&&!Array.isArray(s.shotZones))s.shotZones=null;return s;}
function doImport(json,merge){const mg=(cur,inc,fn)=>{const map={};(cur||[]).forEach(x=>{if(x&&x.id!=null)map[x.id]=x;});(inc||[]).forEach(x=>{if(x&&x.id!=null)map[x.id]=fn?fn(x):x;});return Object.values(map);};
  try{const j=json;
    if(merge){if(Array.isArray(j.sessions))DB.sessions=mg(DB.sessions,j.sessions,sanitizeSession);if(Array.isArray(j.drills))DB.drills=mg(DB.drills,j.drills);if(Array.isArray(j.challenges))DB.challenges=mg(DB.challenges,j.challenges);if(Array.isArray(j.profiles))DB.profiles=mg(DB.profiles,j.profiles);}
    else{if(Array.isArray(j.sessions))DB.sessions=j.sessions.map(sanitizeSession);if(Array.isArray(j.drills)&&j.drills.length)DB.drills=j.drills;if(Array.isArray(j.challenges))DB.challenges=j.challenges;if(Array.isArray(j.profiles)&&j.profiles.length)DB.profiles=j.profiles;if(j.currentProfile)DB.currentProfile=j.currentProfile;if(j.settings)DB.settings=Object.assign({},DEFAULT_SETTINGS,j.settings);}
    migrateDrills(DB);ensureGear();save();S.pendingImport=null;render();toast(merge?"Dados mesclados":"Dados importados");}
  catch(e){toast("Arquivo inválido");}}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="fileImport"){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let j;try{j=JSON.parse(r.result);}catch(err){toast("Arquivo inválido");return;}
    ask2("Importar backup","Mesclar une por id, sem duplicar o que já existe. Substituir troca tudo pelo arquivo.","Mesclar",()=>doImport(j,true),false,{label:"Substituir tudo",fn:()=>doImport(j,false)});};
  r.readAsText(f);e.target.value="";}});

  [".btn.cta","Comece por aqui","Escolhe o drill, confirma o material e o cronômetro faz o resto."]];
function paintTour(){const old=$("#tourOvl");if(old)old.remove();if(S.tour<0||S.screen!=="home")return;
  const t=TOUR[S.tour];if(!t)return;const app=$("#app"),el=app.querySelector(t[0]);if(!el)return;
  const a=app.getBoundingClientRect(),r=el.getBoundingClientRect(),top=r.top-a.top,left=r.left-a.left,below=top+r.height+14,cardTop=below+150<a.height;
  const d=document.createElement("div");d.id="tourOvl";d.setAttribute("role","dialog");d.setAttribute("aria-label","Tour");
  d.style.cssText="position:absolute;inset:0;z-index:40";
  d.innerHTML='<div style="position:absolute;top:'+(top-6)+'px;left:'+(left-6)+'px;width:'+(r.width+12)+'px;height:'+(r.height+12)+'px;border:2px solid var(--acc);border-radius:16px;box-shadow:0 0 0 4px rgba(255,122,26,.18),0 0 0 9999px rgba(6,8,10,.78);pointer-events:none"></div>'
    +'<div class="sheet" style="position:absolute;left:18px;right:18px;'+(cardTop?"top:"+below+"px":"bottom:"+(a.height-top+14)+"px")+';border-radius:16px;border:1px solid var(--bd);padding:16px">'
    +'<div class="lbl" style="color:var(--acc)">'+(S.tour+1)+' de 3</div><div style="font:600 19px var(--fb)">'+t[1]+'</div><div class="sub" style="font-size:13.5px;color:var(--t2)">'+t[2]+'</div>'
    +'<div style="display:flex;gap:11px"><button class="btn" data-a="tourSkip" style="min-height:50px">Pular tour</button><button class="btn p" data-a="tourNext" style="min-height:50px">'+(S.tour===2?"Entendi":"Próximo")+'</button></div></div>';
  app.appendChild(d);}
Object.assign(ACT,{tourNext:()=>{S.tour=S.tour>=2?-1:S.tour+1;render();},tourSkip:()=>{S.tour=-1;render();}});

/* o tour é pintado depois do render (precisa das medidas reais dos elementos) */
const _render3=render;render=function(){_render3();if(S.tour>=0)requestAnimationFrame(paintTour);};

/* =============================================================================
   BOTÃO VOLTAR (Android / gesto do navegador) — fecha o que está aberto em vez
   de sair do app; nas telas de execução, não faz nada.
   ============================================================================= */
const PARENT={step1:"home",step2:"step1",detail:"progress",newDrill:"drills",code:"challenges",newChall:"challenges",ranking:"challenges",micperm:"step2",noshot:"step2",drills:"home",progress:"home",challenges:"home",profile:"home",settings:"home",onboard:"home"};
function handleBack(){
  if(S.tour>=0){S.tour=-1;render();return;}
  if(S.menu||S.ask||S.sheet){S.menu=false;S.ask=null;S.sheet="";render();return;}
  const sc=S.screen;
  if(sc==="timer"||sc==="rest"||sc==="lab"||sc==="score")return;           /* série em andamento */
  if(sc==="result"||sc==="block"){ACT.discard();return;}                    /* resultado não salvo */
  if(sc==="mic"){go(S.micFrom||"settings");return;}
  if(sc==="home")return;
  go(PARENT[sc]||"home");}
try{history.replaceState({cad:1},"");history.pushState({cad:2},"");}catch(e){}
window.addEventListener("popstate",()=>{handleBack();try{history.pushState({cad:2},"");}catch(e){}});

/* =============================================================================
   INICIALIZAÇÃO
   ============================================================================= */
(function init(){
  ensureGear();
  /* quem já tem histórico não vê o onboarding (é a mesma base de dados da v7) */
  if(DB.settings.onboarded==null){DB.settings.onboarded=!!(DB.sessions.length||userName());save();}
  const last=lastSession();
  pickDrill(last&&drillById(last.drillId)?last.drillId:(DB.drills[0]||{}).id);
  S.rest=Math.max(0,Math.min(300,Math.round((DB.settings.blockRest||0)/5)*5));
  if(!DB.settings.onboarded){S.screen="onboard";S.onbStep=0;}
  render();
  if(!window.isSecureContext)toast("Sem HTTPS o microfone não funciona — abra pelo endereço do Netlify.");
  /* resultados de desafio que ficaram na fila sobem assim que houver rede */
  if(FB_ENABLED&&navigator.onLine&&DB.outbox.length)ensureOnline().then(()=>flushOutbox());
})();
</script>
