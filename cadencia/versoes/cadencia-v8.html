<!DOCTYPE html>
<!--
  ============================================================================
  CADÊNCIA v8 — REDESIGN DE UX E FRONT-END · FASE 1 DE 3 (preview)
  ----------------------------------------------------------------------------
  Arquivo de PREVIEW, publicado ao lado da v7 (cadencia.html continua em produção).
  Mesmo domínio => mesmo localStorage (KEY "cadencia_v1") => lê e grava os MESMOS
  dados, no MESMO formato da v7. Nada aqui migra ou apaga dados.

  Origem do design: handoff "Redesign Cadência — UX e Front-end" (Claude Design),
  direção 4a (menu sob demanda), tokens e cópia hifi.

  MOTOR (copiado da v7 sem alteração — DETECÇÃO CONGELADA):
    dados (load/save/migrateDrills), áudio (startMic/micFrame/beep) e detector
    (newDetector/updateFloor/effThresh/isShot). Só a interface é nova.

  FASE 1 (este arquivo): design system, navegação (menu, toast, confirmação) e
    o fluxo de treino completo: Início, Passo 1 (drill), Passo 2 (material),
    Timer, Descanso, Sem-tiro, Pontuação (depois de todas as reps), Resultado e
    Relatório do bloco.
  FASE 2: Progresso, Sessão (detalhe editável), Drills, Criar/editar drill,
    Ajuste de captação, Permissão do mic, Modo Laboratório.
  FASE 3: Desafios/código/ranking (online), Perfil, Config, Onboarding + tour.

  Decisões de compatibilidade (design x app atual):
    - Bloco salva 1 sessão POR REP com blockId (formato v7), não 1 sessão só.
    - "Tempo-alvo por tiro" é exibido; o dado continua sendo o par total (d.par).
    - Pontuação por zona IPSC tiro a tiro; grava smode:"ipsc" + zones (v7 lê).
    - Nada de dado fictício na tela (XP, sugestões inventadas).
  ============================================================================
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Cadência — cronômetro de tiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS (handoff hifi) ===== */
:root{
  --page:#07090b; --bg:#101317; --exec:#0A0C0F;
  --surf:#171b21; --rec:#12161b;
  --bd:#252b33; --ctl:#2f3742; --hov:#3d4652; --track:#1c2128; --bar:#2b3138;
  --acc:#FF7A1A; --acc-h:#ff8c38; --acc-bg:#1d1409;
  --t1:#E8EBEF; --t2:#B9C0C8; --t3:#8A939E; --ph:#5c6672; --pend:#3a424c;
  --ok:#3DDC91; --bad:#FF5C5C; --bad-bg:#1d1416; --bad-bd:#4a2428;
  --fb:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fc:"Barlow Condensed",Barlow,system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{color:var(--t1);font:400 15px var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
a{color:var(--acc)}
input,textarea{outline:none;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--ph)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ===== CASCA: coluna fluida; rodapé colado na base; nada rola a tela inteira ===== */
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:481px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}

/* cabeçalho de 3 posições */
.hdr{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr.home{padding:18px 18px 14px}
.hb{width:44px;height:44px;flex:none;border-radius:12px;background:var(--surf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t2);cursor:pointer;padding:0}
.hdr.home .hb{width:46px;height:46px;border-radius:13px;font-size:19px}
.hb:hover{background:#1d222a}
.hb.me{border-color:var(--acc);color:var(--acc);font:700 12px var(--fc);letter-spacing:.06em}
.hk{flex:1;min-width:0;text-align:center;font:700 11px var(--fc);letter-spacing:.2em;color:var(--t3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk.brand{font-size:12px;letter-spacing:.26em;color:var(--acc)}
.prog{padding:0 18px 8px;display:flex;gap:6px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--bd)}
.prog i.on{background:var(--acc)}

/* texto */
.ttl{padding:8px 18px 10px;font:600 24px var(--fb);line-height:1.15}
.ttl .sub{padding-top:2px}
.sub{font:400 13.5px var(--fb);color:var(--t3);line-height:1.4}
.lbl{font:700 11px var(--fc);letter-spacing:.18em;text-transform:uppercase;color:var(--t3)}
.mono{font-family:var(--fm)}

/* regiões */
.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:0 18px;min-height:0;overflow:auto;padding-bottom:4px}
.foot{padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:11px}

/* cartões */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:13px;color:var(--t1);text-align:left;width:100%;font:inherit}
button.card,.card.click{cursor:pointer}
button.card:hover,.card.click:hover{border-color:var(--hov)}
.card.sel{border:1.5px solid var(--acc)}
.card.sel:hover{border-color:var(--acc)}
.card .nm{font:600 17px var(--fb)}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* botões */
.btn{flex:1;min-height:58px;border-radius:16px;border:1px solid var(--ctl);background:none;color:var(--t2);display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;text-align:center;line-height:1.15;font:500 15px var(--fb);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--hov)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#101317;font:600 17px var(--fb)}
.btn.p:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn.big{min-height:68px;border-radius:18px}
.btn.cta{font:700 16px var(--fc);letter-spacing:.18em}
.btn.sq{flex:none;width:60px;font-size:20px}
.btn.x{flex:1.6}
.btn.danger{border-color:var(--bad-bd);color:var(--bad)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#101317;font:600 16px var(--fb)}
.btn.none{flex:none}
.link{background:none;border:0;padding:6px 0;text-align:left;font:500 14px var(--fb);color:var(--acc);cursor:pointer;align-self:flex-start}
.dash{border:1px dashed var(--ctl);border-radius:14px;padding:13px;text-align:center;font:500 14px var(--fb);color:var(--t2);background:none;cursor:pointer;width:100%}

/* chips de filtro */
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px}
.chip{min-height:40px;border-radius:99px;padding:0 14px;border:1px solid var(--ctl);background:none;color:var(--t3);font:500 12px var(--fc);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#101317}

/* grades de opção (arma / calibre) */
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding-top:9px}
.opt{min-height:44px;border-radius:10px;padding:0 3px;border:1px solid var(--ctl);background:none;color:var(--t2);font:500 13.5px var(--fb);cursor:pointer}
.opt.m{font-family:var(--fm)}
.opt.on{background:var(--acc);border-color:var(--acc);color:#101317}
.opt.add{border:1px dashed var(--hov);font:500 13px var(--fb)}
.inp{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--acc);border-radius:10px;padding:11px 12px;font:500 14px var(--fm);color:var(--t1)}

/* stepper */
.stp{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px}
.sb{width:44px;height:44px;flex:none;border:1px solid var(--ctl);border-radius:10px;background:none;color:var(--t2);font-size:18px;cursor:pointer}
.num{font:700 21px var(--fm);text-align:center;white-space:nowrap}

/* toggle 48x28 */
.tg{width:48px;height:28px;flex:none;border-radius:99px;display:flex;align-items:center;padding:0 3px;background:var(--bd);justify-content:flex-start}
.tg i{width:22px;height:22px;border-radius:50%;background:var(--t3)}
.tg.on{background:var(--acc);justify-content:flex-end}
.tg.on i{background:#101317}

/* KPIs */
.kpis{display:flex;gap:9px;padding:0 18px 13px}
.kpi{flex:1;background:var(--surf);border:1px solid var(--bd);border-radius:13px;padding:12px 6px;text-align:center;min-width:0}
.kpi b{display:block;font:700 22px var(--fm)}
.kpi span{font:700 9.5px var(--fc);letter-spacing:.15em;color:var(--t3);text-transform:uppercase}
.kpi.acc{background:var(--acc-bg);border-color:var(--acc)}
.kpi.acc b,.kpi.acc span{color:var(--acc)}
.kpi b span{font:inherit;letter-spacing:normal;text-transform:none;color:inherit} /* valores com cor própria dentro do KPI */

/* telas de execução (timer / descanso / sem tiro): legíveis a ~2 m */
.exec{background:var(--exec);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));gap:18px;position:relative}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 12px var(--fc);letter-spacing:.18em;text-transform:uppercase;color:var(--t3)}
.topline span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{align-self:center;width:238px;height:238px;flex:none;border:6px solid var(--track);border-top-color:var(--acc);border-right-color:var(--acc);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:10px}
.ring.rest{width:218px;height:218px;border-right-color:var(--track);margin-top:16px}
.clk{font:700 54px var(--fm);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big70{font:700 70px var(--fm);color:var(--acc);font-variant-numeric:tabular-nums}
.rl{font:700 11px var(--fc);letter-spacing:.2em;text-transform:uppercase;color:var(--t3)}
.rows{display:flex;flex-direction:column;gap:8px;padding-top:11px;font:400 13px var(--fm)}
.row{display:flex;align-items:center;gap:9px}
.row .n{width:18px;flex:none;color:var(--t3)}
.bar{height:11px;border-radius:2px;background:var(--acc);flex:none}
.bar.tall{height:15px;border-radius:3px}
.bar.miss{background:var(--bad)}
.bar.pend{background:repeating-linear-gradient(90deg,var(--pend) 0 5px,transparent 5px 8px)}
.ztag{border-radius:5px;padding:1px 7px;border:1px solid var(--ctl);color:var(--t2)}
.ztag.miss{border-color:var(--bad-bd);color:var(--bad)}
.warn{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad);border-radius:12px;padding:9px 12px;font:600 13.5px var(--fb);text-align:center}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flashwhite .5s ease-out}
.flash.go2{animation:flashwhite .5s ease-out 2}
@keyframes flashwhite{0%,100%{opacity:0}40%{opacity:.9}}

/* pontuação */
.shotchips{padding:0 18px 14px;display:flex;flex-wrap:wrap;gap:6px}
.sc{flex:1 0 30px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px var(--fm);border:1px solid var(--bd);color:var(--t3)}
.sc.done{background:var(--acc);border-color:var(--acc);color:#101317}
.sc.miss{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}
.sc.cur{border-color:var(--t1);color:var(--t1)}
.zones{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 14px;min-height:0}
.zb{border-radius:16px;border:1px solid var(--ctl);background:var(--surf);color:var(--t1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;min-height:96px}
.zb:hover,.zb:active{filter:brightness(1.25)}
.zb b{font:700 38px var(--fm)}
.zb span{font:700 12px var(--fc);letter-spacing:.14em}
.zb.miss{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}
.tally{display:flex;gap:7px;padding-top:10px;font:700 14px var(--fm)}
.tally span{flex:1;border-radius:9px;padding:9px 0;text-align:center;border:1px solid var(--bd);color:var(--t3)}
.tally span.on{background:var(--acc);border-color:var(--acc);color:#101317}
.tally span.on.miss{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}

/* tabela */
.tbl{margin:0 18px 13px;background:var(--surf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;flex:none}
.tr{display:flex;padding:11px 14px;border-bottom:1px solid var(--track);align-items:baseline}
.tr:last-child{border-bottom:0}
.tr>span{flex:1;text-align:right;font:400 13.5px var(--fm)}
.tr>span:first-child{text-align:left;font:500 14px var(--fb)}
.tr.h{padding:10px 14px;background:var(--rec);border-bottom:1px solid var(--bd)}
.tr.h>span{font:700 9.5px var(--fc);letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.note{margin:0 18px 13px;background:var(--rec);border-left:2px solid var(--acc);border-radius:0 12px 12px 0;padding:12px 14px;font:400 13.5px var(--fb);color:var(--t2);line-height:1.45}
.empty{border:1px dashed var(--ctl);border-radius:14px;padding:18px;text-align:center;font:400 14px var(--fb);color:var(--t3)}

/* folhas inferiores (menu, confirmação) */
.ovl{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(6,8,10,.74);border:0;padding:0;cursor:pointer}
.sheet{position:relative;background:var(--rec);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:4px;background:var(--ctl);border-radius:2px;align-self:center}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mi{height:78px;background:var(--surf);border:1px solid var(--bd);border-radius:15px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer}
.mi.on{border-color:var(--acc)}
.mi .ic{font-size:18px;color:var(--t3)}
.mi.on .ic{color:var(--acc)}
.mi .nm{font:600 16px var(--fb);color:var(--t1)}
.mi .mt{font:400 12px var(--fb);color:var(--t3)}
.mi .mt.late{color:var(--bad)}
.toast{position:absolute;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--t1);color:#101317;border-radius:13px;padding:14px 16px;font:500 14.5px var(--fb);text-align:center;animation:toastin .18s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flash.go,.flash.go2{animation:none}.toast{animation:none}}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<script>
"use strict";
/* =============================================================================
   MOTOR — copiado da v7 SEM ALTERAÇÃO (dados, migração, áudio, detector).
   DETECÇÃO CONGELADA: isShot / effThresh / updateFloor / micFrame idênticos.
   ============================================================================= */
const KEY="cadencia_v1";
const DEFAULT_DRILLS=[
 {id:"saque",builtin:1,name:"Saque e 1 disparo",desc:"Tempo de saque até o 1º tiro.",shots:1,dist:7,par:1.5,pen:0,tag:"velocidade"},
 {id:"moz",builtin:1,name:"Mozambique",desc:"2 tiros no peito + 1 na cabeça.",shots:3,dist:7,par:3.0,pen:0,tag:"velocidade"},
 {id:"failure",builtin:1,name:"Failure to Stop",desc:"Variante do Mozambique com foco na precisão da cabeça.",shots:3,dist:7,par:3.5,pen:0,tag:"precisão"},
 {id:"bill",builtin:1,name:"Bill Drill",desc:"6 tiros no centro, o mais rápido possível mantendo o acerto.",shots:6,dist:7,par:2.0,pen:0,tag:"velocidade"},
 {id:"triple5",builtin:1,name:"Triple Nickel (5-5-5)",desc:'5 tiros em alvo de 5" a ~5m, par de 5s.',shots:5,dist:4.5,par:5.0,pen:0,tag:"precisão"},
 {id:"r1r2",builtin:1,name:"Recarga 1-R-2",desc:"1 tiro, recarga de emergência (slide-lock), 2 tiros. Mag com 1 munição + mag cheio.",shots:3,dist:7,par:4.5,pen:0,tag:"recarga"},
 {id:"rockreload",builtin:1,name:"Rock the Reload",desc:"1 tiro, troca de carregador, 1 tiro. Dois mags com 1 munição cada.",shots:2,dist:5,par:4.0,pen:0,tag:"recarga"},
 {id:"cock",builtin:1,name:"Engatilha e dispara",desc:"Revólver em ação simples: engatilhar manualmente e disparar com precisão.",shots:2,dist:10,par:4.0,pen:0,tag:"precisão"},
 {id:"malf",builtin:1,name:"Limpa pane e dispara",desc:"Com munição inerte no mag: dispara, encontra a pane, faz tap-rack e volta a atirar.",shots:2,dist:7,par:4.0,pen:0,tag:"recarga"},
 {id:"fast",builtin:1,name:"FAST Drill",desc:'2 na cabeça (cartão 3x5"), recarga, 4 no corpo (círculo 8"). A 7m.',shots:6,dist:7,par:7.0,pen:0,tag:"recarga"},
 {id:"elpres",builtin:1,name:"El Presidente",desc:"De costas: gira, saca, 2 tiros em cada um dos 3 alvos, recarrega, repete.",shots:12,dist:10,par:10.0,pen:0,tag:"recarga"},
 {id:"casino",builtin:1,name:"Casino Drill",desc:"1 tiro no alvo 1, 2 no 2… até 6 no 6. 21 tiros, 2 recargas. +1s por erro.",shots:21,dist:4.5,par:21.0,pen:1,tag:"recarga"},
 {id:"dot",builtin:1,name:"Dot Torture",desc:"50 tiros de precisão em alvos pequenos. Sem pressa, sem erro.",shots:50,dist:3,par:0,pen:0,tag:"precisão"},
 {id:"doubletap",builtin:1,name:"Par Controlado",desc:"2 tiros rápidos no centro, controlando o recuo entre eles.",shots:2,dist:7,par:1.2,pen:0,tag:"velocidade"},
 {id:"r1r1",builtin:1,name:"1-Reload-1",desc:"1 tiro, recarga de velocidade, 1 tiro. Carregador com 1 munição + carregador cheio.",shots:2,dist:7,par:4.0,pen:0,tag:"recarga"},
 {id:"group5",builtin:1,name:"Grupamento (5 tiros)",desc:"5 tiros sem pressa; foco em fechar o menor grupo possível.",shots:5,dist:7,par:0,pen:0,tag:"precisão"},
 {id:"type3",builtin:1,name:"Pane Tipo 3 — Alimentação Dupla",desc:"Monte com munição inerte na câmara + carregador cheio. Ao travar: trava o ferrolho atrás, remove o carregador, racka 3×, recarrega e racka, e volta a atirar.",shots:2,dist:7,par:6.0,pen:0,tag:"recarga",target:'Silhueta IPSC (A/C/D)'},
 {id:"balldummy",builtin:1,name:"Bola e Manequim",desc:"Intercale munição inerte aleatória no carregador. Treina a ação imediata (tap-rack) sem saber quando vem a pane e expõe a antecipação do disparo (flinch).",shots:0,dist:7,par:0,pen:0,tag:"recarga",target:'Silhueta IPSC (A/C/D)'},
 {id:"livre",builtin:1,name:"Treino livre",desc:"Conta os tiros que vierem, sem número fixo.",shots:0,dist:7,par:0,pen:0,tag:"livre"}
];
const DEFAULT_SETTINGS={dlyMin:1.5,dlyMax:4,sound:true,vibrate:true,flash:true,parBeep:true,wake:true,mic:true,sens:55,requireClip:false,audioDeviceId:"",beepVol:"alto",flashDouble:false,blockAdvance:"manual",blockRest:5,echoBlank:150,lab:false,lastExport:0,dry:false};
function load(){let db;try{db=JSON.parse(localStorage.getItem(KEY));}catch(e){db=null;}if(!db||typeof db!=="object")db={};
 if(!Array.isArray(db.drills)||!db.drills.length)db.drills=JSON.parse(JSON.stringify(DEFAULT_DRILLS));
 if(!Array.isArray(db.sessions))db.sessions=[];
 if(!Array.isArray(db.challenges))db.challenges=[];
 if(!Array.isArray(db.outbox))db.outbox=[]; // v5 online: fila de resultados a subir quando houver rede
 if(!Array.isArray(db.profiles)||!db.profiles.length)db.profiles=[{id:"p0",name:"Eu"}];
 if(!db.currentProfile)db.currentProfile=db.profiles[0].id;
 db.settings=Object.assign({},DEFAULT_SETTINGS,db.settings||{});return db;}
let DB=load(), MEM_ONLY=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){MEM_ONLY=true;}}
/* ===== MIGRAÇÃO DE DRILLS (v4, item B) =====
   Conserta a categorização das abas:
   1) adiciona drills de fábrica que faltarem (por id);
   2) re-sincroniza a tag dos drills builtin pelo mapa canônico (= DEFAULT_DRILLS,
      por id) SEM tocar em nome/desc/params que o usuário tenha editado;
   3) marca como "livre" qualquer drill personalizado sem tag.
   É idempotente (rodar de novo não muda nada). Retorna true se algo mudou. */
/* v5 E3: alvo recomendado padrão dos drills de fábrica (preenchido na migração). */

/* ===== AUDIO + MIC ===== */
/* v3: detecção adaptativa de transiente.
   - getFloatTimeDomainData (resolução real, sem 8-bit).
   - mede PICO + RMS + fração de amostras "no teto" (clip) por quadro.
   - o gatilho compara o pico contra um PISO de ruído aprendido (EWMA),
     exigindo uma margem em dB. O slider só ajusta essa margem.
   - guarda de eco: após um tiro, o nível-guarda decai e segura a cauda/reverberação. */
let AC=null,analyser=null,micStream=null,micBuf=null,micProc=null;
function ensureAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC;}
/* v4 (item D): beep redesenhado — dois osciladores (1000+1500 Hz, onda quadrada),
   ~0,22s, ataque rápido + decaimento exponencial. O ganho final vem do setting
   beepVol (baixo/médio/alto -> 0,5/0,75/1,0). O beep de fim de par usa o mesmo. */
function beepGain(){return ({baixo:0.5,medio:0.75,alto:1.0})[DB.settings.beepVol]||1.0;}
function beep(dur=0.22){if(!DB.settings.sound)return;try{const ac=ensureAC(),g=ac.createGain(),vol=beepGain(),t=ac.currentTime;[1000,1500].forEach(f=>{const o=ac.createOscillator();o.type="square";o.frequency.value=f;o.connect(g);o.start();o.stop(t+dur+0.02);});g.connect(ac.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol*0.5,t+0.005);/* v6 D1: /2 p/ os 2 osciladores não saturarem — senão médio/alto saíam iguais */g.gain.exponentialRampToValueAtTime(0.001,t+dur);}catch(e){}}
async function startMic(deviceId){try{const ac=ensureAC();const audio={echoCancellation:{ideal:false},noiseSuppression:{ideal:false},autoGainControl:{ideal:false}};if(deviceId)audio.deviceId={exact:deviceId};micStream=await navigator.mediaDevices.getUserMedia({audio});const src=ac.createMediaStreamSource(micStream);analyser=ac.createAnalyser();analyser.fftSize=2048;micBuf=new Float32Array(analyser.fftSize);src.connect(analyser);
  // tenta ler o que o aparelho REALMENTE aplicou (alguns ignoram os pedidos)
  try{micProc=micStream.getAudioTracks()[0].getSettings();}catch(e){micProc=null;}
  return true;}catch(e){return false;}}
function stopMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}analyser=null;micProc=null;}
const DISP=1.0, CLIP_LVL=0.985; // DISP: barra em fração de escala plena; CLIP_LVL: amostra "no teto"
/* lê um quadro e devolve pico, rms e fração clipada */
function micFrame(){if(!analyser)return{peak:0,rms:0,clip:0};analyser.getFloatTimeDomainData(micBuf);let pk=0,sum=0,cl=0;const N=micBuf.length;for(let i=0;i<N;i++){const v=micBuf[i],a=v<0?-v:v;if(a>pk)pk=a;sum+=v*v;if(a>=CLIP_LVL)cl++;}return{peak:pk,rms:Math.sqrt(sum/N),clip:cl/N};}
/* margem do slider: sens 99 -> +6 dB (fácil); sens 1 -> +30 dB (rígido) */
function marginDb(s){s=Math.max(1,Math.min(99,s));return 6+(99-s)/98*24;}
function marginFactor(s){return Math.pow(10,marginDb(s)/20);}
/* estado adaptativo compartilhado entre calibração e treino */
function newDetector(){return{floor:0,guard:0,lastT:-999,warm:8,wmin:9,rearmed:true};}
const ABS_GATE=0.015;      // pico mínimo absoluto pra cogitar um tiro (mata silêncio)
const GUARD_DECAY=0.90;    // decaimento do nível-guarda por quadro (~120 ms p/ cair à metade)
const GUARD_REARM=0.66;    // novo tiro precisa bater 66% do guarda que ainda decai
/* v7 F1: MIN_SPLIT_S removido — o refratário virou a janela anti-eco (echoBlank) na v6. */
/* atualiza o piso de ruído. Warm-up (~130ms) semeia com o mínimo, evitando falso
   positivo quando o ambiente já começa barulhento (ex.: aparelho com ganho quente). */
function updateFloor(det,peak){
  if(det.warm>0){det.wmin=Math.min(det.wmin,peak);det.warm--;if(det.warm===0)det.floor=Math.max(det.wmin,0.004);return;}
  if(peak<det.floor*4){det.floor=det.floor*0.93+peak*0.07;}   // ambiente: segue rápido
  else{det.floor=det.floor*0.998+peak*0.002;}                  // transiente (tiro): quase congela
  if(det.floor<0.003)det.floor=0.003;
}
function effThresh(det,sens){return Math.min(0.93,Math.max(det.floor*marginFactor(sens),det.guard*GUARD_REARM));}
/* decide se o quadro atual é um tiro; nowS = tempo em segundos da referência atual */
/* v6 (item B): re-armar por JANELA ANTI-ECO — substitui o refratário fixo de 90ms.
   Só conta o próximo tiro quando (a) passou mais que echoBlank ms desde o último E
   (b) o nível voltou perto do piso (peak < floor×2) ao menos uma vez desde então —
   prova de que o som decaiu. Mantém o gate absoluto (ABS_GATE) e a lógica de clip. */
function isShot(det,fr,sens,nowS,requireClip){det.guard*=GUARD_DECAY;const gUsed=det.guard;/* v7 B5: guarda efetivo (decaído) que o effThresh consome */const warming=det.warm>0;const th=effThresh(det,sens);const blank=(DB.settings.echoBlank||150)/1000;if(fr.peak<det.floor*2)det.rearmed=true;const ok=!warming&&fr.peak>=ABS_GATE&&fr.peak>=th&&(nowS-det.lastT)>blank&&det.rearmed!==false&&(!requireClip||fr.clip>0.0015);updateFloor(det,fr.peak);if(ok){det.lastT=nowS;det.guard=fr.peak;det.rearmed=false;}det.lastDec={thresh:th,guard:gUsed};/* v7 B5: registro do que foi REALMENTE usado (não altera a decisão) */return ok;}

/* 9. RELATÓRIO DO BLOCO */
SCREENS.block=()=>{
  const rows=T.runs.map(r=>Object.assign({rep:r.rep},calc(r)));
  const sc=rows.filter(x=>x.scored&&x.total>0),hfs=sc.map(x=>x.hf);
  const bestHf=hfs.length?Math.max(...hfs):null,avg=hfs.length?hfs.reduce((a,b)=>a+b,0)/hfs.length:null;
  const dev=hfs.length>1?Math.sqrt(hfs.reduce((a,b)=>a+(b-avg)*(b-avg),0)/hfs.length):null;
  let insight;
  if(hfs.length>1){const bi=sc[hfs.indexOf(bestHf)],wi=sc[hfs.indexOf(Math.min(...hfs))];insight="Sua melhor rep foi a "+bi.rep+" (HF "+fmt(bi.hf,2)+") e a mais fraca a "+wi.rep+" (HF "+fmt(wi.hf,2)+"). Quanto menor o desvio, mais repetível está seu ritmo.";}
  else if(hfs.length===1)insight="Só uma rep foi pontuada. Pontue as outras depois, no detalhe da sessão, para comparar o ritmo.";
  else{const tt=rows.filter(x=>x.total>0).map(x=>x.total);insight=tt.length>1?"Sem pontuação, dá para comparar só o tempo: a mais rápida levou "+fmt(Math.min(...tt),2)+" s e a mais lenta "+fmt(Math.max(...tt),2)+" s.":"Sem pontuação: só os tempos foram guardados.";}
  const d=T.drill;
  return '<div class="scr">'+hdr(B.menu,"Relatório do bloco",B.home)
    +'<div class="ttl" style="padding-top:0">'+esc(d.name)+'<div class="sub">'+plural(T.runs.length,"rep","reps")+(T.runs.length<T.reps?" de "+T.reps+" (parcial)":"")+' · '+esc(T.cal)+' · '+fnum(T.dist)+' m</div></div>'
    +'<div class="kpis">'+kpi(bestHf!=null?fmt(bestHf,2):dash,"Melhor HF",false,bestHf!=null?"var(--acc)":"")+kpi(avg!=null?fmt(avg,2):dash,"HF médio")+kpi(dev!=null?fmt(dev,2):dash,"Desvio",false,dev!=null?(dev<0.4?"var(--ok)":"var(--bad)"):"")+'</div>'
    +'<div class="body" style="padding:0;gap:0"><div class="tbl"><div class="tr h"><span>Rep</span><span>Tempo</span><span>1º tiro</span><span>Precisão</span><span>HF</span></div>'
    +rows.map(x=>'<div class="tr"><span>'+x.rep+'</span><span>'+fmt(x.total,2)+'</span><span>'+(x.first!=null?fmt(x.first,2):dash)+'</span><span style="color:'+(x.scored?(x.m?"var(--bad)":"var(--ok)"):"var(--t3)")+'">'+(x.scored?fmt(x.acc,0)+"%":dash)+'</span><span style="font-weight:700;color:'+(x.scored&&x.hf===bestHf?"var(--acc)":"var(--t1)")+'">'+(x.scored?fmt(x.hf,2):dash)+'</span></div>').join("")
    +'</div><div class="note">'+insight+'</div></div>'
    +'<div class="foot" style="padding-top:0"><button class="btn" data-a="discard">Descartar</button><button class="btn p x" data-a="saveBlock">Salvar bloco</button></div></div>';
};

  +'<div class="foot"><a class="btn p" href="cadencia.html">Abrir a versão atual</a></div></div>';});

/* ---------- linhas "tiro a tiro" ---------- */
function shotRows(r,withZones){
  if(!r.shots.length)return '<div class="sub">Nenhum tiro registrado.</div>';
  const sp=r.shots.map((t,i)=>i?t-r.shots[i-1]:t),mx=Math.max(...sp,0.01);
  return sp.map((v,i)=>{const z=withZones&&r.zones?r.zones[i]:null;
    return '<div class="row"><span class="n">'+(i+1)+'</span><div class="bar tall'+(z==="M"?" miss":"")+'" style="width:'+Math.max(6,v/mx*55)+'%"></div><span style="width:44px;flex:none">'+fmt(v,2)+'</span>'+(z?'<span class="ztag'+(z==="M"?" miss":"")+'">'+(z==="M"?"miss":z)+'</span>':'')+'</div>';}).join("");
}

/* ---------- cálculo de uma rep (fórmulas do handoff) ----------
   hit factor = pontos / tempo total (pontos nunca negativos na exibição)
   precisão   = (tiros − misses) / tiros · split[i] = t[i] − t[i−1] */
function calc(r){
  const shots=r.shots,total=r.total||0,first=shots.length?shots[0]:null;
  const splits=shots.slice(1).map((t,i)=>t-shots[i]);
  const o={total,first,splits,scored:false,a:0,c:0,d:0,m:0,hits:0,miss:0,points:0,acc:0,hf:0};
  if(r.zones&&r.zones.length){r.zones.forEach(z=>{if(z==="A")o.a++;else if(z==="C")o.c++;else if(z==="D")o.d++;else o.m++;});
    o.scored=true;o.hits=o.a+o.c+o.d;o.miss=o.m;o.points=o.a*5+o.c*3+o.d-o.m*10;
    o.acc=r.zones.length?o.hits/r.zones.length*100:0;o.hf=total>0?Math.max(0,o.points)/total:0;}
  return o;
}

/* =============================================================================

   ============================================================================= */
function render(){

function go(screen){S.menu=false;S.ask=null;S.screen=screen;S.showAddCal=false;render();const b=document.querySelector(".body");if(b)b.scrollTop=0;}
/* seleciona um drill e já puxa a distância padrão dele */
function pickDrill(id){const d=drillById(id);if(!d)return;S.selId=id;S.dist=d.dist||7;}

const ACT={
  menu:()=>{S.menu=true;render();},
  menuClose:()=>{S.menu=false;render();},
  go:v=>go(v),
  flow:()=>{if(!selDrill())pickDrill((DB.drills[0]||{}).id);go("step1");},
  resume:()=>{const s=lastSession();if(!s)return go("step1");pickDrill(s.drillId);S.dist=s.dist||S.dist;S.reps=s.blockSize||1;
    if(s.weapon&&GUNS.indexOf(s.weapon)>=0){DB.settings.gun=s.weapon;if(s.cal)DB.settings.cal=s.cal;}ensureGear();save();go("step2");},
  filter:v=>{S.filter=v;const list=DB.drills.filter(d=>v==="all"||d.tag===v);if(list.length&&!list.some(d=>d.id===S.selId))pickDrill(list[0].id);render();},
  pick:v=>{pickDrill(v);render();},
  step2:()=>{const d=selDrill(),vis=DB.drills.some(x=>x.id===S.selId&&(S.filter==="all"||x.tag===S.filter));if(!d||!vis){toast("Escolha um drill");return;}go("step2");},
  gun:v=>{DB.settings.gun=v;DB.settings.cal=calsFor(v)[0];S.showAddCal=false;save();render();},
  cal:v=>{DB.settings.cal=v;save();render();},
  addCalOpen:()=>{S.showAddCal=!S.showAddCal;render();},
  addCalSave:()=>{const v=(($("#addCal")||{}).value||"").trim();if(!v){toast("Escreva o calibre");return;}const g=DB.settings.gun;

    if(calsFor(g).indexOf(v)<0)arr.push(v);DB.settings.cal=v;S.showAddCal=false;save();render();toast(v+" adicionado aos calibres de "+g);},
  dist:v=>{S.dist=Math.max(1,Math.min(50,Math.round(S.dist)+(+v)));render();},

  retry:()=>runRep(),

/* =============================================================================
   FLUXO DE TREINO — liga a interface ao motor (mesma sequência da v7:
   standby aprendendo o piso -> atraso aleatório -> beep/vibração/flash ->
   loop do detector -> auto-stop no nº de tiros)
   ============================================================================= */
function startTraining(challenge){
  let d=selDrill();ensureGear();
  if(challenge){d=drillById(challenge.drillId)||(challenge.drillSnap?Object.assign({id:challenge.drillId,builtin:0,tag:"livre"},challenge.drillSnap):null);}
  if(!d){toast("Drill indisponível neste aparelho");return;}
  DB.settings.blockRest=S.rest;save();
  const reps=challenge?1:S.reps;
  T={drill:d,challenge:challenge||null,gun:DB.settings.gun,cal:DB.settings.cal,dist:challenge?challenge.dist:S.dist,reps,rest:reps>1?S.rest:0,blockId:reps>1?uid():null,rep:1,runs:[],restLeft:0,scoreIdx:0,zones:[],queue:[]};
  if(challenge&&challenge.online)ensureOnline().then(ok=>{if(ok)setPresence(challenge.code,"atirando");});
  runRep();
}
async function runRep(){
  S.menu=false;S.ask=null;S.screen="timer";
  const r={det:newDetector(),shots:[],started:false,beepAt:0,raf:null,preRaf:null,goTimer:null,parTimer:null,autoTimer:null,useMic:micOn(),micFail:false};
  run=r;render();ensureAC();reqWake();
  if(r.useMic){const ok=await startMic(DB.settings.audioDeviceId||undefined);if(run!==r)return;/* cancelado enquanto pedia permissão */
    if(!ok){r.useMic=false;r.micFail=true;}else{DB.settings.micGranted=true;save();if(DB.settings.lab)startLabRec(r);preLoop();}}
  const s=DB.settings,delay=(s.dlyMin+Math.random()*Math.max(0,s.dlyMax-s.dlyMin))*1000;
  r.goTimer=setTimeout(goSignal,delay);paintTimer();
}
/* standby: aprende o piso de ruído enquanto espera o beep (idêntico à v7) */
function preLoop(){if(!run||run.started||!run.useMic)return;const perf=performance.now(),flUsed=run.det.floor;const fr=micFrame();updateFloor(run.det,fr.peak);
  /* Modo Laboratório (v7 B7/B6): frames do standby entram na timeline */
  if(run.lab&&run.lab.tl.length<40000){const th=effThresh(run.det,DB.settings.sens);run.lab.tl.push({tMs:null,tPerf:+perf.toFixed(2),phase:"standby",peak:+fr.peak.toFixed(4),rms:+fr.rms.toFixed(4),clip:+fr.clip.toFixed(4),floor:+flUsed.toFixed(4),thresh:+th.toFixed(4),guard:+run.det.guard.toFixed(4),shot:0});}
  run.preRaf=requestAnimationFrame(preLoop);}
/* largada: beep + vibração + flash (sinal visual redundante para quem usa protetor) */
function goSignal(){if(!run)return;if(run.preRaf)cancelAnimationFrame(run.preRaf);
  run.det.lastT=-999;run.det.guard=0;run.beepAt=performance.now();if(run.lab)run.lab.meta.beepPerf=+run.beepAt.toFixed(2);run.started=true;beep();
  if(DB.settings.vibrate&&navigator.vibrate)navigator.vibrate([90,40,90]);
  if(DB.settings.flash){const f=$("#flash");if(f){f.className="flash";void f.offsetWidth;f.className="flash "+(DB.settings.flashDouble?"go2":"go");}}
  if(T.drill.par>0&&DB.settings.parBeep)run.parTimer=setTimeout(()=>beep(),T.drill.par*1000);
  paintTimer();loop();}
/* loop do detector — mesma chamada de decisão da v7 (isShot com sens/requireClip);
   R1: se o AudioContext cair (app voltou do fundo), tenta retomar e avisa */
function loop(){if(!run||!run.started)return;const now=(performance.now()-run.beepAt)/1000;
  if(run.useMic&&AC){if(AC.state!=="running"){try{AC.resume();}catch(e){}}run.acDown=AC.state!=="running";}
  if(run.useMic){const perf=performance.now(),flUsed=run.det.floor;const fr=micFrame();let sh=0;if(isShot(run.det,fr,DB.settings.sens,now,!!DB.settings.requireClip)){registerShot(now);sh=1;}
    if(run&&run.lab&&run.lab.tl.length<40000){const dec=run.det.lastDec||{thresh:0,guard:0};run.lab.tl.push({tMs:Math.round(now*1000),tPerf:+perf.toFixed(2),phase:"run",peak:+fr.peak.toFixed(4),rms:+fr.rms.toFixed(4),clip:+fr.clip.toFixed(4),floor:+flUsed.toFixed(4),thresh:+dec.thresh.toFixed(4),guard:+dec.guard.toFixed(4),shot:sh});}}
  if(!run)return;
  const c=document.getElementById("clk");if(c)c.textContent=fmt(now,2);
  paintWarn();run.raf=requestAnimationFrame(loop);}
function registerShot(t){run.shots.push(t);paintSplits();const n=T.drill.shots;
  if(n>0&&run.shots.length>=n&&!run.autoTimer)run.autoTimer=setTimeout(()=>{if(run&&run.started)stopRep();},250);}
function clearRunTimers(r){if(!r)return;["raf","preRaf"].forEach(k=>{if(r[k])cancelAnimationFrame(r[k]);});["goTimer","parTimer","autoTimer"].forEach(k=>{if(r[k])clearTimeout(r[k]);});}
/* Parar: aproveita os tiros já detectados */
function stopRep(){const r=run;if(!r)return;clearRunTimers(r);r.started=false;run=null;
  const total=r.shots.length?r.shots[r.shots.length-1]:(performance.now()-r.beepAt)/1000;
  const cont=()=>{stopMic();relWake();
    if(r.useMic&&!r.shots.length){S.screen="noshot";render();return;}
    T.runs.push({rep:T.rep,shots:r.shots.slice(),total,zones:null});afterRep();};
  if(r.lab)finishLab(r,cont);else cont();}
/* Cancelar (antes da largada): volta ao preparo; no meio de um bloco, vai pontuar o que já foi feito */
function cancelRep(){const r=run;clearRunTimers(r);if(r&&r.lab&&r.lab.rec&&r.lab.rec.state==="recording"){try{r.lab.rec.stop();}catch(e){}}stopMic();relWake();run=null;
  if(T&&T.runs.length){beginScoring();return;}T=null;go("step2");}
function afterRep(){if(T.rep<T.reps){T.rep++;if(T.rest>0)startRest();else runRep();}else beginScoring();}

/* pintura parcial do timer (sem re-render) */
function paintTimer(){const ph=$("#ph"),b=$("#stopBtn");if(!run)return;
  if(ph){ph.textContent=run.started?"● ao vivo":(run.useMic?"standby":"standby · dry-fire");ph.style.color=run.started?"var(--bad)":"var(--t3)";}
  if(b)b.textContent=run.started?"Parar":"Cancelar";paintSplits();paintWarn();}
function paintSplits(){const el=$("#spl");if(!el||!run)return;const sh=run.shots,exp=T.drill.shots,n=Math.max(exp,sh.length);
  const sp=sh.map((t,i)=>i?t-sh[i-1]:t),mx=Math.max(0.5,...sp);let h="";
  for(let i=0;i<n;i++)h+=i<sh.length?'<div class="row"><span class="n">'+(i+1)+'</span><div class="bar" style="width:'+Math.max(6,sp[i]/mx*62)+'%"></div><span>'+fmt(sp[i],2)+'</span></div>'
    :'<div class="row"><span class="n">'+(i+1)+'</span><div class="bar pend" style="width:28%"></div><span style="color:var(--pend)">'+dash+'</span></div>';
  el.innerHTML=h||'<div class="sub">'+(run.useMic?"Os tiros aparecem aqui conforme o microfone detecta.":"Dry-fire: toque em Parar no último tiro.")+'</div>';
  if(sh.length)el.parentElement.scrollTop=el.parentElement.scrollHeight;}
function paintWarn(){const w=$("#mwarn");if(!w||!run)return;let msg="";
  if(run.micFail)msg="Microfone indisponível — sem detecção. Toque em Parar no último tiro.";
  else if(run.acDown)msg="⚠ Microfone pausado — detecção interrompida";
  if(w.textContent!==msg){w.textContent=msg;w.style.display=msg?"block":"none";}}

/* descanso entre reps */
function startRest(){T.restLeft=T.rest;restPaused=false;S.screen="rest";render();clearInterval(restTimer);
  restTimer=setInterval(()=>{T.restLeft--;if(T.restLeft<=0){clearRest();runRep();}else{const el=$("#restLeft");if(el)el.textContent=T.restLeft;}},1000);}
function clearRest(){clearInterval(restTimer);restTimer=null;}
/* B11 (v7): nunca largar com o app em segundo plano — pausa a contagem e,
   na volta, reinicia o descanso inteiro (o atirador pode estar longe da baia).
   R1 (v7): ao voltar com um treino ativo, retoma o AudioContext. */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){if(restTimer){clearRest();restPaused=true;}}
  else{if(run&&run.started){reqWake();if(AC&&AC.state!=="running"){try{AC.resume();}catch(e){}}}
    if(restPaused&&T&&S.screen==="rest"){restPaused=false;startRest();toast("Descanso reiniciado");}}
});

/* =============================================================================
   PONTUAÇÃO — depois de todas as reps; reps sem tiro são puladas
   ============================================================================= */
function beginScoring(){T.queue=T.runs.map((r,i)=>i).filter(i=>T.runs[i].shots.length>0);T.scoreIdx=0;T.zones=[];
  if(!T.queue.length){finishScoring();return;}S.screen="score";render();}
function scoreRun(){return T.runs[T.queue[T.scoreIdx]];}
function scoreZone(z){const r=scoreRun();if(!r)return;T.zones.push(z);
  if(T.zones.length>=r.shots.length){r.zones=T.zones.slice();T.zones=[];T.scoreIdx++;if(T.scoreIdx>=T.queue.length){finishScoring();return;}}
  render();}
function scoreUndo(){if(T.zones.length){T.zones.pop();render();return;}
  if(T.scoreIdx>0){T.scoreIdx--;const r=scoreRun();T.zones=(r.zones||[]).slice(0,-1);r.zones=null;render();}}
function finishScoring(){if(T.editSession){applyRescore();return;}S.screen=T.runs.length===1?"result":"block";render();}

   SALVAR — formato de sessão da v7 (cada rep vira uma sessão; bloco via blockId)
   ============================================================================= */

  hits:c.hits,miss:c.miss,points:c.points,acc:+c.acc.toFixed(1),hf:+c.hf.toFixed(3),
  corr:+(c.total+c.miss*(d.pen||0)).toFixed(3),scored:c.scored,
  blockId:T.blockId||undefined,repIndex:T.blockId?r.rep:undefined,blockSize:T.blockId?T.reps:undefined,notes:""};}
function saveTraining(){if(!T)return;const n=T.runs.length,ch=T.challenge,saved=T.runs.map(sessionFrom);saved.forEach(x=>DB.sessions.push(x));save();

/* injeta um <script> de CDN uma única vez */
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const el=document.createElement("script");el.src=src;el.onload=()=>res();el.onerror=()=>rej(new Error("falha ao carregar "+src));document.head.appendChild(el);});}
/* carrega o SDK compat do Firebase sob demanda (mantém o app em arquivo único) */
async function loadFirebase(){if(fb.loaded)return;const b="https://www.gstatic.com/firebasejs/"+FB_VER+"/";await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js");fb.loaded=true;}
/* inicializa Firebase + login anônimo; tenta persistência offline. true se pronto. */
async function ensureOnline(){if(!FB_ENABLED)return false;try{await loadFirebase();
  if(!fb.ready){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);fb.auth=firebase.auth();fb.db=firebase.firestore();
    try{await fb.db.enablePersistence({synchronizeTabs:true});}catch(e){/* multi-aba/sem suporte: segue sem cache offline */}fb.ready=true;}
  if(!fb.uid){const c=await fb.auth.signInAnonymously();fb.uid=(c&&c.user&&c.user.uid)||(fb.auth.currentUser&&fb.auth.currentUser.uid);}
  flushOutbox();return !!fb.uid;
 }catch(e){return false;}}
/* v8: nome de exibição online = nome do atirador ativo (definido no Perfil ou no onboarding) */
function onlineName(){return userName()||"Atirador";}
const CODE_CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem 0/O/1/I para não confundir
function newCode(){let s="";const a=new Uint8Array(6),g=(typeof crypto!=="undefined"&&crypto.getRandomValues)?crypto:{getRandomValues:x=>{for(let i=0;i<x.length;i++)x[i]=Math.floor(Math.random()*256);return x;}};g.getRandomValues(a);for(let i=0;i<6;i++)s+=CODE_CHARS[a[i]%CODE_CHARS.length];return s;}
/* compara dois resultados pela métrica do desafio (true se 'a' é melhor que 'b') */
function metricBetter(a,b,m){if(m==="hf")return (a.hf||0)>(b.hf||0);if(m==="total")return (a.total||1e9)<(b.total||1e9);return (a.first==null?1e9:a.first)<(b.first==null?1e9:b.first);}

/* ---- FILA OFFLINE (DB.outbox): resultado salvo local sempre; sobe quando há rede ---- */
function queueResult(code,metric,result){DB.outbox.push({code,metric,result});save();}
async function flushOutbox(){if(!navigator.onLine||!fb.ready||!fb.uid||!DB.outbox.length)return;
 for(const item of DB.outbox.slice()){try{await pushResult(item.code,item.metric,Object.assign({},item.result,{uid:fb.uid}));DB.outbox=DB.outbox.filter(x=>x!==item);save();}catch(e){item.tries=(item.tries||0)+1;if(item.tries>=5){item.failed=true;DB.outbox=DB.outbox.filter(x=>x!==item);}/* v7 B3: após 5 falhas sai da fila ativa (sem retry eterno) */save();}}}
/* grava o melhor-por-uid via transação (idempotente: reenviar não duplica) */
async function pushResult(code,metric,r){const ref=fb.db.collection("challenges").doc(code).collection("results").doc(fb.uid);
 await fb.db.runTransaction(async tx=>{const snap=await tx.get(ref);if(snap.exists){const cur=snap.data();if(!metricBetter(r,cur,metric))return;}tx.set(ref,r);});}
/* envia o resultado de um desafio online (enfileira sempre; tenta subir já se houver rede) */
async function submitOnlineResult(ch,sess){const r={uid:fb.uid||null,name:onlineName(),total:sess.total,first:sess.first,hf:sess.hf,acc:sess.acc,nShots:sess.nShots,weapon:sess.weapon,cal:sess.cal,date:sess.date,splits:sess.splits||[]};
 queueResult(ch.code,ch.metric,r);if(await ensureOnline()){flushOutbox();setPresence(ch.code,"terminou");}}

/* =============================================================================
   PROGRESSO — período, categoria e relatório; tudo recalculado do histórico
   ============================================================================= */
const REPORTS={all:["Resumo","Evolução","Consistência"],velocidade:["Resumo","Evolução","1º tiro","Splits"],"precisão":["Resumo","Zonas","Grupos"],recarga:["Resumo","Recargas","Splits"],livre:["Resumo","Evolução"]};
const REPORT_HINT={"Resumo":"lista de sessões e melhor marca","Evolução":"como o hit factor mudou sessão a sessão","Consistência":"quanto seu ritmo varia por drill","1º tiro":"tempo até o primeiro disparo","Splits":"intervalo entre tiros, por posição","Zonas":"onde os tiros caíram e quantos pontos","Grupos":"precisão por sessão","Recargas":"tempo da troca de carregador"};
const PERIODS=[["7","7 d"],["30","30 d"],["90","90 d"],["all","Tudo"]];
const catLabel=k=>(CATS.find(c=>c.k===k)||{}).l||"Todos";
const dshort=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","");
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sdOf=a=>{if(a.length<2)return null;const m=avgOf(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length);};
const isScored=s=>s.scored!==false&&s.hf>0;

/* sessões do atirador ativo, no período e categoria escolhidos, em ordem cronológica */
function progSessions(){const days={"7":7,"30":30,"90":90}[S.period],now=Date.now();
  return DB.sessions.filter(s=>s.profileId===DB.currentProfile&&(S.pcat==="all"||((drillById(s.drillId)||{}).tag||"livre")===S.pcat)&&(!days||now-new Date(s.date).getTime()<=days*864e5))
    .sort((a,b)=>new Date(a.date)-new Date(b.date));}
/* tempo da recarga: se o drill marca "recarga após o tiro N", usa o split exato; senão, o maior split */
function reloadSplit(s){const d=drillById(s.drillId)||{},sp=s.splits||[];if(!sp.length)return null;if(d.reload&&d.after>0&&sp[d.after-1]!=null)return sp[d.after-1];return Math.max(...sp);}

/* monta KPIs + tabela + nota de cada relatório (regras do handoff) */
function buildReport(arr){const R=S.report,T2={kpis:[],head:[],rows:[],note:""};const sc=arr.filter(isScored);
  if(R==="Evolução"){const hf=sc.map(s=>s.hf);T2.kpis=[[avgOf(hf),"HF médio"],[hf.length?Math.max(...hf):null,"Melhor"],[hf.length>1?hf[hf.length-1]-hf[0]:null,"Tendência",true]];
    T2.head=["Sessão","HF","Δ","Tempo"];T2.rows=sc.slice().reverse().map((s,i,a)=>{const prev=a[i+1],d=prev?s.hf-prev.hf:null;return [dshort(s.date)+" · "+esc(s.drillName),fmt(s.hf,2),d==null?dash:'<span style="color:'+(d>=0?"var(--ok)":"var(--bad)")+'">'+(d>=0?"+":"")+fmt(d,2)+'</span>',fmt(s.total,2)];});
    T2.note="Δ compara com a sessão anterior dentro do mesmo filtro. Verde quando o hit factor subiu.";}
  else if(R==="Consistência"){const g={};sc.forEach(s=>{(g[s.drillName]=g[s.drillName]||[]).push(s.hf);});const ks=Object.keys(g);const devs=ks.map(k=>sdOf(g[k])).filter(x=>x!=null);
    T2.kpis=[[avgOf(devs),"Desvio médio"],[ks.length,"Drills",false,true],[sc.length,"Sessões",false,true]];T2.head=["Drill","Sessões","HF méd.","Desvio"];
    T2.rows=ks.map(k=>{const d=sdOf(g[k]);return [esc(k),g[k].length,fmt(avgOf(g[k]),2),d==null?dash:'<span style="color:'+(d<0.4?"var(--ok)":"var(--bad)")+'">'+fmt(d,2)+'</span>'];});
    T2.note="Desvio-padrão do hit factor entre as sessões de cada drill. Quanto menor, mais repetível o seu ritmo.";}
  else if(R==="1º tiro"){const fs=arr.filter(s=>s.first>0),v=fs.map(s=>s.first),best=v.length?Math.min(...v):null;
    T2.kpis=[[best,"Melhor"],[avgOf(v),"Média"],[fs.length,"Sessões",false,true]];T2.head=["Sessão","1º tiro","Δ melhor","HF"];
    T2.rows=fs.slice().reverse().map(s=>[dshort(s.date)+" · "+esc(s.drillName),fmt(s.first,2),s.first===best?'<span style="color:var(--ok)">melhor</span>':"+"+fmt(s.first-best,2),isScored(s)?fmt(s.hf,2):dash]);
    T2.note="Tempo do beep até o primeiro disparo. Δ é a distância para o seu melhor 1º tiro no período.";}
  else if(R==="Splits"){const pos=[];arr.forEach(s=>(s.splits||[]).forEach((v,i)=>{(pos[i]=pos[i]||[]).push(v);}));const all=[].concat(...pos.filter(Boolean));
    T2.kpis=[[avgOf(all),"Split médio"],[all.length?Math.min(...all):null,"Melhor"],[all.length?Math.max(...all):null,"Pior"]];T2.head=["Posição","Média","Melhor","Pior"];
    T2.rows=pos.map((a,i)=>a?[(i+1)+"→"+(i+2),fmt(avgOf(a),2),fmt(Math.min(...a),2),fmt(Math.max(...a),2)]:null).filter(Boolean);
    T2.note="Intervalo entre tiros agrupado pela posição na série. O 1º tiro (saque) fica de fora.";}
  else if(R==="Zonas"){const z={a:0,c:0,d:0,ms:0};arr.forEach(s=>{if(s.zones){z.a+=s.zones.a||0;z.c+=s.zones.c||0;z.d+=s.zones.d||0;z.ms+=s.zones.ms||0;}});const n=z.a+z.c+z.d+z.ms,pts=z.a*5+z.c*3+z.d-z.ms*10;
    T2.kpis=[[n?(n-z.ms)/n*100:null,"Precisão",false,false,"%"],[pts,"Pontos",false,true],[z.ms,"Misses",false,true]];T2.head=["Zona","Tiros","%","Pontos"];
    T2.rows=[["A",z.a,5],["C",z.c,3],["D",z.d,1],["Miss",z.ms,-10]].map(([l,c,p])=>[l,c,n?fmt(c/n*100,0)+"%":dash,(c*p>0?"+":"")+c*p]);
    T2.note="Soma das zonas IPSC das sessões pontuadas por zona: A +5, C +3, D +1, miss −10.";}
  else if(R==="Grupos"){T2.kpis=[[arr.length,"Sessões",false,true],[avgOf(sc.map(s=>s.hf)),"HF médio"],[(()=>{const f=arr.map(s=>s.first).filter(x=>x>0);return f.length?Math.min(...f):null;})(),"Melhor 1º"]];
    T2.head=["Sessão","Tiros","Precisão","HF"];T2.rows=arr.slice().reverse().map(s=>[dshort(s.date)+" · "+esc(s.drillName),s.nShots||0,s.scored!==false&&(s.hits+s.miss)>0?fmt(s.acc,0)+"%":dash,isScored(s)?fmt(s.hf,2):dash]);
    T2.note="Precisão = tiros no alvo ÷ tiros pontuados, sessão a sessão.";}
  else if(R==="Recargas"){const rs=arr.map(s=>({s,r:reloadSplit(s)})).filter(x=>x.r!=null),v=rs.map(x=>x.r);
    T2.kpis=[[v.length?Math.min(...v):null,"Melhor recarga"],[avgOf(v),"Média"],[rs.length,"Sessões",false,true]];T2.head=["Sessão","Recarga","Tempo","HF"];
    T2.rows=rs.slice().reverse().map(x=>[dshort(x.s.date)+" · "+esc(x.s.drillName),fmt(x.r,2),fmt(x.s.total,2),isScored(x.s)?fmt(x.s.hf,2):dash]);
    T2.note="Usa o split da posição marcada no drill (\"recarga após o tiro N\"). Drills sem essa marcação usam o maior split da série como estimativa.";}
  return T2;}
/* número-herói do relatório: valor atual + variação (último vs média dos anteriores) */
function heroFor(arr){const R=S.report,sc=arr.filter(isScored);let series,label,lowerBetter=false,unit="";
  if(R==="1º tiro"){series=arr.filter(s=>s.first>0).map(s=>s.first);label="1º tiro médio";lowerBetter=true;unit=" s";}
  else if(R==="Splits"){series=arr.map(s=>avgOf(s.splits||[])).filter(x=>x!=null);label="split médio";lowerBetter=true;unit=" s";}
  else if(R==="Recargas"){series=arr.map(reloadSplit).filter(x=>x!=null);label="recarga média";lowerBetter=true;unit=" s";}
  else if(R==="Zonas"||R==="Grupos"){series=arr.filter(s=>s.scored!==false&&(s.hits+s.miss)>0).map(s=>s.acc);label="precisão média";unit="%";}
  else{series=sc.map(s=>s.hf);label="hit factor médio";}
  const v=avgOf(series);let delta=null;if(series.length>1){const last=series[series.length-1],prev=avgOf(series.slice(0,-1));delta=last-prev;}
  return {label,v,delta,lowerBetter,unit,dec:unit==="%"?0:2};}

    const sel='<div style="display:flex;gap:10px;padding:0 18px 12px;flex:none">'
      +'<button class="card click" data-a="sheet" data-v="cat" style="flex:1;padding:10px 13px"><div class="lbl" style="font-size:10px">Categoria</div><div class="split"><span style="font:600 15px var(--fb)">'+catLabel(S.pcat)+'</span><span style="color:var(--t3)">▾</span></div></button>'

        +(arr.length>S.histMax?'<button class="dash" data-a="more">Mostrar mais ('+(arr.length-S.histMax)+')</button>':'')+'</div>';}

/* =============================================================================
   SESSÃO — detalhe com edição de tiros, (re)pontuação e exclusão
   ============================================================================= */
function curSess(){return DB.sessions.find(s=>s.id===S.detId);}
/* tempos absolutos reconstruídos a partir de 1º tiro + splits */
function sessTimes(s){if(s.first==null)return [];const t=[s.first];(s.splits||[]).forEach(x=>t.push(+(t[t.length-1]+x).toFixed(3)));return t;}
function sessionInsight(s){const sp=s.splits||[];if(sp.length<2)return sp.length?"Um único split: "+fmt(sp[0],2)+" s entre o 1º e o 2º tiro.":"Com um tiro só, o que conta é o tempo até o primeiro disparo.";
  const worst=Math.max(...sp),i=sp.indexOf(worst),m=avgOf(sp);return "Seu pior split foi "+fmt(worst,2)+" s (tiro "+(i+1)+"→"+(i+2)+") contra "+fmt(m,2)+" s de média.";}
SCREENS.detail=()=>{const s=curSess();if(!s){S.screen="progress";return SCREENS.progress();}
  const dt=new Date(s.date),times=sessTimes(s),r={shots:times,zones:s.shotZones||null};
  const meta=dshort(s.date)+" · "+dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+" · "+fnum(s.dist)+" m · "+esc(s.cal||"")+(s.smode==="ipsc"&&s.zones?" · IPSC":"")+(s.blockSize>1?" · rep "+s.repIndex+"/"+s.blockSize:"");
  const ch=s.challengeId?DB.challenges.find(c=>c.id===s.challengeId):null;
  let shotsBox;
  if(S.detEdit){shotsBox='<div class="rows" style="gap:6px">'+(times.length?times.map((t,i)=>'<div class="row split" style="gap:9px"><span class="n">'+(i+1)+'</span><span style="flex:1">'+fmt(t,2)+' s</span><button class="hb" data-a="shotDel" data-v="'+i+'" aria-label="Remover tiro '+(i+1)+'" style="width:40px;height:40px;color:var(--bad)">✕</button></div>').join(""):'<div class="sub">Nenhum tiro.</div>')+'</div>'
      +'<div style="display:flex;gap:8px;padding-top:10px"><input class="inp" id="shotAdd" inputmode="decimal" placeholder="tempo do tiro, ex: 2,35" aria-label="Tempo do tiro em segundos"><button class="btn p none" data-a="shotAdd" style="min-height:44px;border-radius:10px;font-size:14px">Adicionar</button></div>'
      +'<div class="sub" style="font-size:12px;padding-top:6px">Remova falsos disparos ou inclua um tiro que o microfone perdeu. Tempos contados a partir do beep.</div>';}
  else shotsBox='<div class="rows" style="gap:9px">'+shotRows(r,true)+'</div>';
  return '<div class="scr">'+hdr(B.back("progress","Voltar ao progresso"),"Sessão",B.home)
    +'<div class="ttl" style="padding-top:0">'+esc(s.drillName)+'<div class="sub">'+meta+(ch?' · desafio '+esc(ch.name):'')+'</div></div>'
    +'<div class="kpis">'+kpi(fmt(s.total,2),"Total")+kpi(s.first!=null?fmt(s.first,2):dash,"1º tiro")+kpi(isScored(s)?fmt(s.hf,2):dash,"Hit factor",true)+'</div>'
    +'<div class="body" style="padding:0;gap:0">'
    +'<div class="card" style="margin:0 18px 13px;width:auto"><div class="split"><div class="lbl">'+(S.detEdit?"Editar tiros":"Tiro a tiro")+'</div><button class="link" data-a="detEdit" style="padding:0">'+(S.detEdit?"Concluir":"Editar tiros")+'</button></div>'+shotsBox+'</div>'
    +(s.scored===false?'<div class="card split" style="margin:0 18px 13px;width:auto;border-color:var(--acc)"><div><div style="font:600 15px var(--fb)">Sem pontuação</div><div class="sub">Pontue as zonas para entrar nas médias de HF e precisão.</div></div><button class="btn p none" data-a="rescore" style="min-height:48px;border-radius:12px;font-size:15px">Pontuar</button></div>'
      :'<div class="card split" style="margin:0 18px 13px;width:auto"><div><div class="lbl">Zonas</div><div class="sub" style="padding-top:4px">'+(s.zones?"A ×"+(s.zones.a||0)+" · C ×"+(s.zones.c||0)+" · D ×"+(s.zones.d||0)+" · miss ×"+(s.zones.ms||0)+" · "+s.points+" pts":(s.hits||0)+" acertos · "+(s.miss||0)+" erros")+'</div></div><button class="link" data-a="rescore" style="padding:0">Repontuar</button></div>')
    +'<div class="note">'+sessionInsight(s)+'</div></div>'
    +'<div class="foot"><button class="btn danger" data-a="sessDel">Excluir</button><button class="btn p x" data-a="repeat">Repetir drill</button></div></div>';
};
/* aplica uma nova lista de tiros à sessão e recalcula tudo que depende do tempo */
function applyShots(s,times){times=times.slice().sort((a,b)=>a-b);let zoneReset=false;
  s.first=times.length?+times[0].toFixed(3):null;s.splits=times.slice(1).map((t,i)=>+(t-times[i]).toFixed(3));s.nShots=times.length;
  if(times.length)s.total=+times[times.length-1].toFixed(3);
  if(s.shotZones&&s.shotZones.length!==times.length){s.shotZones=null;s.zones=null;s.hits=0;s.miss=0;s.points=0;s.acc=0;s.hf=0;s.scored=false;zoneReset=true;}
  else if(s.scored!==false)s.hf=s.total>0?+(Math.max(0,s.points||0)/s.total).toFixed(3):0;
  s.corr=+(s.total+(s.miss||0)*((drillById(s.drillId)||{}).pen||0)).toFixed(3);
  save();resubmit(s);return zoneReset;}
/* sessão de desafio online editada: reenvia ao ranking (v7 B4) */
function resubmit(s){const ch=s.challengeId?DB.challenges.find(c=>c.id===s.challengeId&&c.online):null;if(ch&&typeof submitOnlineResult==="function")submitOnlineResult(ch,s);}
/* re-pontuar: reaproveita a tela de pontuação com os tiros da sessão */
function rescoreSession(s){const times=sessTimes(s);if(!times.length){toast("Sem tiros para pontuar — adicione em Editar tiros");return;}
  const d=drillById(s.drillId)||{id:s.drillId,name:s.drillName,shots:times.length,par:0,pen:0};
  T={editSession:s,drill:d,challenge:null,gun:s.weapon,cal:s.cal,dist:s.dist,reps:1,rest:0,blockId:null,rep:1,runs:[{rep:1,shots:times,total:s.total,zones:null}],restLeft:0,scoreIdx:0,zones:[],queue:[]};
  beginScoring();}
function applyRescore(){const s=T.editSession,r=T.runs[0],c=calc(r);T=null;
  if(!c.scored){go("detail");return;} /* "Pontuar depois": nada muda (v7 B8) */
  Object.assign(s,{smode:"ipsc",zones:{a:c.a,c:c.c,d:c.d,ms:c.m},shotZones:r.zones.slice(),hits:c.hits,miss:c.miss,points:c.points,acc:+c.acc.toFixed(1),hf:+c.hf.toFixed(3),corr:+(s.total+c.miss*((drillById(s.drillId)||{}).pen||0)).toFixed(3),scored:true});
  save();resubmit(s);go("detail");toast("Pontuação salva");}
Object.assign(ACT,{
  detEdit:()=>{S.detEdit=!S.detEdit;render();},
  shotDel:v=>{const s=curSess();if(!s)return;ask("Remover o tiro "+(+v+1)+"?","Tempos, splits e hit factor são recalculados.","Remover",()=>{const t=sessTimes(s);t.splice(+v,1);const z=applyShots(s,t);render();toast(z?"Tiro removido · pontuação zerada, pontue de novo":"Tiro removido");},true);},
  shotAdd:()=>{const s=curSess(),el=$("#shotAdd");if(!s||!el)return;const t=parseFloat(String(el.value).replace(",","."));if(!isFinite(t)||t<=0||t>600){toast("Escreva um tempo válido em segundos");return;}
    const z=applyShots(s,sessTimes(s).concat([t]));render();toast(z?"Tiro adicionado · pontuação zerada, pontue de novo":"Tiro adicionado");},
  rescore:()=>{const s=curSess();if(s)rescoreSession(s);},
  sessDel:()=>{const s=curSess();if(!s)return;ask("Excluir esta sessão?",esc(s.drillName)+" de "+dshort(s.date)+" sai do histórico deste aparelho.","Excluir",()=>{DB.sessions=DB.sessions.filter(x=>x.id!==s.id);save();go("progress");toast("Sessão excluída");},true);},
  repeat:()=>{const s=curSess();if(!s)return;if(!drillById(s.drillId)){toast("Esse drill não existe mais na biblioteca");return;}pickDrill(s.drillId);S.dist=s.dist||S.dist;S.reps=1;
    if(GUNS.indexOf(s.weapon)>=0){DB.settings.gun=s.weapon;DB.settings.cal=s.cal;ensureGear();save();}go("step2");}
});

function drillCards(list){return list.length?list.map(d=>'<div class="card click" data-a="drillTrain" data-v="'+esc(d.id)+'" role="button" tabindex="0" style="padding:14px"><div class="split" style="align-items:flex-start"><div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="nm">'+esc(d.name)+'</span><span style="border:1px solid var(--ctl);border-radius:6px;padding:1px 7px;font:700 10px var(--fc);letter-spacing:.12em;text-transform:uppercase;color:var(--t3)">'+catLabel(d.tag)+'</span></div><div class="sub" style="font-size:13px;padding-top:2px">'+drillMeta(d)+'</div></div><button class="link" data-a="drillEdit" data-v="'+esc(d.id)+'" style="padding:4px 0 4px 10px;flex:none">editar</button></div></div>').join("")

/* =============================================================================
   AJUSTE DE CAPTAÇÃO — mesma lógica da calibração da v7 (detector próprio,
   isShot com a sensibilidade e o requireClip salvos); só a apresentação muda.
   Margem em dB: a tela ajusta dB e converte para "sens" (a escala do motor).
   ============================================================================= */
let calRAF=null,calDet=null,calHist=[],calCount=0,calOpenTok=0;
const dbOf=v=>20*Math.log10(Math.max(v,1e-4)); /* dBFS */
const pctDb=v=>Math.max(0,Math.min(100,(dbOf(v)+60)/60*100)); /* −60..0 dBFS → 0..100% */
const sensFromDb=db=>Math.max(1,Math.min(99,Math.round(99-(db-6)*98/24)));
function micAdvice(db){return db<10?"Margem baixa: vizinhos de baia podem disparar falsos.":db>22?"Margem alta: tiros mais fracos podem passar batido.":"Margem equilibrada para a maioria dos stands.";}
SCREENS.mic=()=>{const s=DB.settings,db=Math.round(marginDb(s.sens));
  return '<div class="scr">'+hdr(B.back(S.micFrom||"settings","Voltar"),"Ajuste de captação",B.home)
    +'<div class="body">'
    +'<div class="sub" style="font-size:14px;color:var(--t2)">Bata uma palma forte. Seus disparos precisam cruzar a linha branca; o fundo, não.</div>'
    +(S.micErr?'<div class="warn">Microfone indisponível. Libere a permissão no navegador e abra pelo endereço https do Netlify.</div>':'')
    +'<div class="card" style="background:var(--rec);padding:12px"><div style="position:relative;height:148px;display:flex;align-items:flex-end;gap:2px" id="viz" aria-hidden="true">'+Array.from({length:40},()=>'<i style="flex:1;height:2%;background:var(--bar);border-radius:2px 2px 0 0"></i>').join("")
      +'<div id="vizTh" style="position:absolute;left:0;right:0;height:0;border-top:2px solid #fff;bottom:50%"></div><div id="vizFl" style="position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--t3);bottom:10%"></div></div>'
      +'<div class="lbl" style="font-size:10px;padding-top:8px">Branca = gatilho · cinza = ruído</div></div>'
    +'<div class="card"><div class="split"><div class="lbl">Margem de detecção</div><div class="sub" style="font-size:12px">acima do ruído</div></div>'+stepper("micMargin",db+" dB","margem")+'<div class="sub" style="font-size:12.5px;padding-top:8px;color:'+(db<10||db>22?"var(--acc)":"var(--t3)")+'">'+micAdvice(db)+'</div></div>'
    +'<div style="display:flex;gap:9px">'+kpi('<span id="cDet" style="color:var(--ok)">0</span>',"Detectados")+kpi('<span id="cPk">'+dash+'</span>',"Pico dB")+kpi('<span id="cFl">'+dash+'</span>',"Piso dB")+'</div>'
    +'<div class="card"><div class="split"><div class="lbl">Janela anti-eco</div><div class="sub" style="font-size:12px">ms</div></div>'+stepper("micEcho",(s.echoBlank||150),"janela anti-eco")+'<div class="sub" style="font-size:12.5px;padding-top:8px">Janela maior ignora mais eco, mas perde splits muito rápidos. Indoor pede janela maior.</div></div>'
    +'<button class="card split" data-a="micClip" role="switch" aria-checked="'+!!s.requireClip+'"><div><div style="font:500 15px var(--fb)">Exigir impacto forte</div><div class="sub" style="font-size:12.5px">só conta sons que saturam o microfone</div></div><span class="tg'+(s.requireClip?" on":"")+'"><i></i></span></button>'
    +'<label class="card" style="display:block"><div class="lbl">Dispositivo de áudio</div><select id="micDev" style="width:100%;margin-top:8px;background:var(--bg);color:var(--t1);border:1px solid var(--ctl);border-radius:10px;padding:11px;font:400 14.5px var(--fb)"><option value="">Padrão do aparelho</option>'+S.micDevs.map((d,i)=>'<option value="'+esc(d.deviceId)+'"'+(d.deviceId===s.audioDeviceId?" selected":"")+'>'+esc(d.label||"Microfone "+(i+1))+'</option>').join("")+'</select><div class="sub" id="micProcLine" style="font-size:12.5px;padding-top:8px"></div></label>'
    +'</div><div class="foot"><button class="btn" data-a="micRelearn">Reaprender</button><button class="btn p x" data-a="go" data-v="'+(S.micFrom||"settings")+'">Concluir</button></div></div>';};
async function openMic(){const tok=++calOpenTok;calDet=newDetector();calHist=[];calCount=0;
  const ok=await startMic(DB.settings.audioDeviceId||undefined);if(tok!==calOpenTok||S.screen!=="mic"){stopMic();return;}
  if(!ok){S.micErr=true;render();return;}S.micErr=false;DB.settings.micGranted=true;save();
  try{const devs=await navigator.mediaDevices.enumerateDevices();S.micDevs=devs.filter(d=>d.kind==="audioinput");}catch(e){S.micDevs=[];}
  if(S.screen==="mic")render();
  const step=()=>{if(S.screen!=="mic"||tok!==calOpenTok)return;const fr=micFrame(),nowS=performance.now()/1000,sens=DB.settings.sens;
    const th=effThresh(calDet,sens);if(isShot(calDet,fr,sens,nowS,!!DB.settings.requireClip))calCount++;
    calHist.push({p:fr.peak,hit:fr.peak>=th});if(calHist.length>40)calHist.shift();paintMic(th);calRAF=requestAnimationFrame(step);};step();}
function closeMic(){calOpenTok++;if(calRAF)cancelAnimationFrame(calRAF);calRAF=null;stopMic();}
function paintMic(th){const v=$("#viz");if(!v)return;const bars=v.querySelectorAll("i");const off=bars.length-calHist.length;
  bars.forEach((b,i)=>{const h=calHist[i-off];b.style.height=h?Math.max(2,pctDb(h.p))+"%":"2%";b.style.background=h&&h.hit?"var(--acc)":"var(--bar)";});
  const t=$("#vizTh"),f=$("#vizFl");if(t)t.style.bottom=pctDb(th)+"%";if(f&&calDet)f.style.bottom=pctDb(calDet.floor)+"%";
  const last=calHist[calHist.length-1];const cd=$("#cDet"),cp=$("#cPk"),cf=$("#cFl");if(cd)cd.textContent=calCount;if(cp&&last)cp.textContent=Math.round(dbOf(last.p));if(cf&&calDet&&calDet.floor)cf.textContent=Math.round(dbOf(calDet.floor));}
/* status do processamento que o APARELHO aplicou (alguns ignoram o pedido de desligar) */
function paintMicStatic(){const el=$("#micProcLine");if(!el)return;const p=micProc;if(!p){el.textContent="";return;}
  const on=v=>v===true,parts=[];if("autoGainControl"in p)parts.push("ganho automático "+(on(p.autoGainControl)?"LIGADO":"desligado"));if("noiseSuppression"in p)parts.push("redução de ruído "+(on(p.noiseSuppression)?"LIGADA":"desligada"));
  const bad=on(p.autoGainControl)||on(p.noiseSuppression)||on(p.echoCancellation);
  el.style.color=bad?"var(--acc)":"var(--t3)";el.textContent=parts.length?(bad?"⚠ ":"✓ ")+"Este aparelho: "+parts.join(" · ")+(bad?". Ele ignorou o pedido de desligar; \"exigir impacto forte\" ajuda.":"."):"O aparelho não informa o que aplica no áudio.";}
document.addEventListener("change",async e=>{if(e.target&&e.target.id==="micDev"){DB.settings.audioDeviceId=e.target.value;save();closeMic();S.micErr=false;openMic();}});
Object.assign(ACT,{
  micMargin:v=>{const db=Math.max(6,Math.min(30,Math.round(marginDb(DB.settings.sens))+(+v)));DB.settings.sens=sensFromDb(db);save();render();},
  micEcho:v=>{DB.settings.echoBlank=Math.max(60,Math.min(500,(DB.settings.echoBlank||150)+10*(+v)));save();render();},
  micClip:()=>{DB.settings.requireClip=!DB.settings.requireClip;save();calDet=newDetector();render();},
  micRelearn:()=>{calDet=newDetector();calHist=[];calCount=0;toast("Piso de ruído reaprendido");}
});
/* abrir o ajuste lembra de onde veio (Concluir volta para lá) */
const _goMic=ACT.go;ACT.go=v=>{if(v==="mic"&&S.screen!=="mic")S.micFrom=S.screen==="noshot"?"step2":S.screen;_goMic(v);};

/* =============================================================================
   PERMISSÃO DO MICROFONE — antes de ligar a detecção pela primeira vez
   ============================================================================= */
SCREENS.micperm=()=>'<div class="scr"><div class="body" style="justify-content:center;align-items:center;text-align:center;gap:14px;padding-top:20px">'
  +'<div style="width:82px;height:82px;border-radius:22px;border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--acc)">🎙</div>'

  +'<div style="font:400 14.5px var(--fb);color:var(--t2);line-height:1.5;max-width:300px">O Cadência ouve os disparos para marcar cada tiro. Nada é enviado: o áudio é analisado no próprio celular e descartado.</div>'
  +'<div class="card" style="text-align:left;display:flex;flex-direction:column;gap:9px">'+["Tempo de cada tiro sem tocar na tela","Splits e hit factor calculados sozinhos","Funciona offline, no stand"].map(t=>'<div style="display:flex;gap:10px;font:400 14px var(--fb);color:var(--t2)"><span style="color:var(--ok)">✓</span>'+t+'</div>').join("")+'</div></div>'
  +'<div class="foot" style="flex-direction:column"><button class="btn p" data-a="micAllow" style="flex:none">Permitir microfone</button><button class="btn" data-a="micDry" style="flex:none;min-height:52px">Continuar em dry-fire</button></div></div>';
Object.assign(ACT,{

/* =============================================================================
   MODO LABORATÓRIO — grava o áudio da série + a linha do tempo do detector.
   Idêntico em conteúdo à v7 (Camada 1): thresh/guard reais, fases standby/run,
   tPerf contínuo, recStartPerf/beepPerf. Aditivo: não muda detecção nem pontuação.
   ============================================================================= */
let LAB=null;
function startLabRec(r){try{const id=uid();r.lab={id,tl:[],chunks:[],rec:null,meta:{id,date:new Date().toISOString(),drill:T.drill.name,weapon:T.gun,cal:T.cal,dist:T.dist,rep:T.rep,expectedShots:T.drill.shots,detectedShots:0,sens:DB.settings.sens,marginDb:Math.round(marginDb(DB.settings.sens)),requireClip:!!DB.settings.requireClip,echoBlank:DB.settings.echoBlank,sampleRate:AC?AC.sampleRate:null,processing:micProc||null,userAgent:navigator.userAgent,recStartPerf:null,beepPerf:null}};
  if(window.MediaRecorder&&micStream){try{const mr=new MediaRecorder(micStream);mr.ondataavailable=e=>{if(e.data&&e.data.size)r.lab.chunks.push(e.data);};mr.start();r.lab.meta.recStartPerf=+performance.now().toFixed(2);r.lab.rec=mr;}catch(e){r.lab.recErr=true;}}else r.lab.recErr=true;}catch(e){}}
/* encerra a gravação (com timeout de 1,5 s, v7 R3), fecha o mic (R2) e mostra o painel */
function finishLab(r,cont){const lab=r.lab;lab.meta.detectedShots=r.shots.length;lab.meta.shots=r.shots.map(t=>+t.toFixed(3));let done=false;
  const fin=()=>{if(done)return;done=true;try{lab.blob=lab.chunks.length?new Blob(lab.chunks,{type:(lab.rec&&lab.rec.mimeType)||"audio/webm"}):null;}catch(e){lab.blob=null;}stopMic();relWake();LAB={lab,cont,real:"",obs:"",msg:""};S.screen="lab";render();};
  if(lab.rec&&lab.rec.state==="recording"){lab.rec.onstop=fin;try{lab.rec.stop();}catch(e){fin();}setTimeout(fin,1500);}else fin();}
function labModel(){const m=(/(iPhone|iPad|Android[^;)]{0,18}|Macintosh|Windows|Linux)/.exec(navigator.userAgent)||[])[0]||"web";return m.replace(/[^a-zA-Z0-9]/g,"");}
function labPrefix(l){const d=new Date(l.meta.date),p=n=>String(n).padStart(2,"0");return "cadencia_lab_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+"_"+labModel()+"_"+l.id;}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function labData(){const l=LAB.lab;return{meta:l.meta,realShots:LAB.real!==""?+LAB.real:null,obs:LAB.obs.trim(),timeline:l.tl};}
SCREENS.lab=()=>{if(!LAB){S.screen="home";return SCREENS.home();}const l=LAB.lab,m=l.meta,p=m.processing;
  return '<div class="scr">'+hdr('<span style="width:44px"></span>',"Laboratório",'<span style="width:44px"></span>')
    +'<div class="ttl" style="padding-top:0">Sessão de laboratório<div class="sub">'+esc(m.drill)+(T&&T.reps>1?' · rep '+m.rep+' de '+T.reps:'')+' · áudio + linha do tempo do detector</div></div>'
    +'<div class="kpis">'+kpi(m.detectedShots,"Detectados")+kpi(m.expectedShots>0?m.expectedShots:"livre","Esperados")+kpi(m.sampleRate?Math.round(m.sampleRate/1000)+"k":dash,"Sample rate")+'</div>'
    +'<div class="body">'

const metricLabel=m=>m==="hf"?"por hit factor":m==="total"?"por tempo":"por 1º tiro";
function curChal(){return DB.challenges.find(c=>c.id===S.chalId);}
function daysLeft(ch){if(!ch.endsAt)return null;return Math.ceil((ch.endsAt-Date.now())/864e5);}
/* ranking de desafio LOCAL: melhor resultado por atirador, pela métrica do desafio */
function localRows(ch){const m=ch.metric||"hf",val=s=>m==="hf"?(s.hf||0):m==="total"?(s.total||9999):(s.first==null?9999:s.first),high=m==="hf";
  const best={};DB.sessions.filter(s=>s.challengeId===ch.id).forEach(s=>{const k=s.profileId;if(!(k in best)||(high?val(s)>val(best[k]):val(s)<val(best[k])))best[k]=s;});
  return Object.values(best).map(s=>({uid:s.profileId,name:s.profileName,total:s.total,first:s.first,hf:s.hf,acc:s.acc,me:s.profileId===DB.currentProfile}))
    .sort((a,b)=>high?(b.hf||0)-(a.hf||0):(val(a)-val(b)));}
function rowsFor(ch){if(!ch)return [];if(!ch.online)return localRows(ch);
  const rows=(S.rankRows&&S.rankRows.id===ch.id?S.rankRows.rows:null)||ch.lastRows||[];const m=ch.metric||"hf",high=m==="hf";
  const val=s=>m==="hf"?(+s.hf||0):m==="total"?(+s.total||9999):(s.first==null?9999:+s.first);
  return rows.slice().sort((a,b)=>high?val(b)-val(a):val(a)-val(b)).map(r=>Object.assign({},r,{me:r.uid&&fb.uid&&r.uid===fb.uid}));}
function myPos(ch){const r=rowsFor(ch),i=r.findIndex(x=>x.me);return i<0?null:i+1;}

SCREENS.challenges=()=>{

    +(n.kind==="online"?'<div class="note" style="margin:0">Só o resultado do desafio sobe. Seu treino pessoal fica no aparelho.</div>':'<div class="note" style="margin:0">No desafio local, cada atirador entra no seu perfil deste aparelho e revezam o celular.</div>')

SCREENS.ranking=()=>{const ch=curChal();if(!ch){S.screen="challenges";return SCREENS.challenges();}
  const d=drillById(ch.drillId);
  return '<div class="scr">'+hdr(B.back("challenges","Voltar aos desafios"),"Ranking",B.home)
    +'<div style="padding:0 18px 12px" class="split"><div style="min-width:0"><div style="font:600 22px var(--fb)">'+esc(ch.name)+'</div><div class="sub">'+esc(d?d.name:(ch.drillName||"?"))+' · '+fnum(ch.dist)+' m · '+metricLabel(ch.metric)+'</div></div>'
      +(ch.online?'<button class="link" data-a="copyCode" style="text-align:right;flex:none;padding:0"><span class="mono" style="font-weight:700;font-size:17px;color:var(--acc);letter-spacing:.08em">'+esc(ch.code)+'</span><br><span style="font-size:12px">copiar</span></button>':'')+'</div>'
